# Etapa 32: Nginx distribui os pedidos entre as cópias do serviço "app" (rodízio).
# O DNS do Docker devolve um endereço por cópia; com "resolve" o Nginx reconsulta a cada 5 s,
# então cópias novas (docker compose up --scale app=4) entram sem reiniciar o Nginx.
upstream violet_voltage {
    zone violet_voltage 64k;
    server app:3000 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
}

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    client_max_body_size 6m;

    location / {
        proxy_pass http://violet_voltage;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Se uma cópia cair no meio, tenta a próxima (só para pedidos que podem ser repetidos).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
        add_header X-Balanceador nginx always;
    }
}
