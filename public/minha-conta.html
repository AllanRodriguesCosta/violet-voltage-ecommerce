<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Violet Voltage: guitarras, pedais, amplificadores e acessórios. Turn Up Your Tone." />
    <meta name="theme-color" content="#120b19" />
    <title>Minha conta | Violet Voltage</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/ui.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main id="main" tabindex="-1">
      <div class="container page-wrap">
        <nav class="breadcrumb" aria-label="Trilha de navegação"><a href="/">Início</a><span aria-hidden="true">/</span><span aria-current="page">Minha conta</span></nav>
        <header class="page-head">
          <div><span class="eyebrow">Minha conta</span><h1 class="page-title" id="account-greeting">Seu espaço, seu som.</h1><p class="lead">Dados pessoais e histórico de compras em um só lugar.</p></div>
          <button type="button" id="logout" class="secondary">Sair da conta</button>
        </header>
        <div class="account-grid">
          <section class="panel" aria-labelledby="profile-title">
            <h2 id="profile-title">Meu perfil</h2>
            <form id="profile-form">
              <div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" type="text" required minlength="2" maxlength="200" autocomplete="name" /></div>
              <div class="field"><label for="email">E-mail de acesso</label><input id="email" name="email" type="email" readonly /></div>
              <div class="field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" maxlength="30" autocomplete="tel" /></div>
              <div class="field"><label for="endereco">Endereço</label><input id="endereco" name="endereco" type="text" maxlength="500" autocomplete="street-address" /></div>
              <button type="submit" class="full">Salvar meus dados</button>
            </form>
          </section>
          <section id="pedidos" aria-labelledby="orders-title">
            <h2 id="orders-title">Minhas compras</h2>
            <p class="small muted">Abra um pedido para consultar os itens e a entrega.</p>
            <div id="orders"><div class="loading">Carregando compras…</div></div>
          </section>
        </div>
      </div>
    </main>
    <div id="footer"></div>
  </body>
</html>
