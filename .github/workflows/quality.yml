name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Analisar código
        run: npm run lint
      - name: Executar testes isolados
        run: npm test

  # Etapa 31: a imagem usada no Azure (VMs atrás do Load Balancer) precisa construir e responder
  # no /api/health; os roteiros de infra/azure passam pelo shellcheck.
  container-and-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Conferir roteiros do Azure (shellcheck)
        run: shellcheck --severity=warning -x -P infra/azure infra/azure/*.sh
      - name: Construir a imagem
        run: docker build -t violet-voltage-ci .
      - name: Subir o contêiner e testar /api/health
        run: |
          docker run -d --name vv -p 3000:3000 -e NODE_ENV=development -e DEV_MEMORY_STORAGE=true \
            -e INSTANCE_NAME=ci-1 -e CATALOG_SYNC=off violet-voltage-ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health -o health.json -D headers.txt; then break; fi
            sleep 2
          done
          cat health.json
          grep -q '"instancia":"ci-1"' health.json
          grep -qi '^x-served-by: ci-1' headers.txt
          test "$(docker inspect --format '{{.Config.User}}' violet-voltage-ci)" = "node"
      - name: Balanceamento local (docker compose - 3 cópias, Nginx e PostgreSQL)
        run: |
          docker compose -f infra/local/docker-compose.yml up --build -d --wait --wait-timeout 240
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/api/health && break; sleep 1; done
          node scripts/lb-check.js http://127.0.0.1:8080 30 | tee lb.txt
          grep -q "3 instâncias responderam" lb.txt
          curl -fsS -D raiz.txt -o /dev/null http://127.0.0.1:8080/
          grep -qi '^x-balanceador: nginx' raiz.txt
          # Tolerância a falha: com uma cópia parada, as outras duas continuam respondendo.
          docker stop "$(docker compose -f infra/local/docker-compose.yml ps -q app | head -n 1)"
          # O Nginx reconsulta o DNS a cada 5 s; até 3 tentativas para ele notar a cópia parada.
          ok=0
          for t in 1 2 3; do
            sleep 3
            node scripts/lb-check.js http://127.0.0.1:8080 20 | tee lb2.txt
            if grep -q "2 instâncias responderam" lb2.txt && ! grep -q "falha" lb2.txt; then ok=1; break; fi
          done
          test "$ok" = 1
      - name: Registro do contêiner em caso de falha
        if: failure()
        run: |
          docker logs vv || true
          docker compose -f infra/local/docker-compose.yml logs --tail 80 || true
          # Resumo também como anotação (aparece na página do PR sem abrir o log).
          diag=$( { cat lb.txt lb2.txt; docker compose -f infra/local/docker-compose.yml ps -a --format '{{.Name}} {{.Status}}'; docker compose -f infra/local/docker-compose.yml logs --no-color --tail 6 app balanceador; } 2>&1 | head -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=diagnostico::$diag"
