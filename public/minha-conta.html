<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Violet Voltage: guitarras, pedais, amplificadores e acessórios. Turn Up Your Tone." />
    <meta name="theme-color" content="#120b19" />
    <meta name="robots" content="noindex" />
    <meta property="og:site_name" content="Violet Voltage" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Minha conta | Violet Voltage" />
    <meta property="og:description" content="Violet Voltage: guitarras, pedais, amplificadores e acessórios. Turn Up Your Tone." />
    <title>Minha conta | Violet Voltage</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/ui.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main id="main" tabindex="-1">
      <div class="container page-wrap">
        <nav class="breadcrumb" aria-label="Trilha de navegação"><a href="/">Início</a><span aria-hidden="true">/</span><span aria-current="page">Minha conta</span></nav>
        <header class="page-head">
          <div><span class="eyebrow">Minha conta</span><h1 class="page-title" id="account-greeting">Seu espaço, seu som.</h1><p class="lead">Acompanhe seus pedidos e mantenha seus dados em dia.</p></div>
          <button type="button" id="logout" class="secondary"><span data-icon="logout" data-size="18"></span>Sair da conta</button>
        </header>
        <div class="account-stats" id="account-stats"></div>
        <div class="account-grid">
          <section id="pedidos" aria-labelledby="orders-title">
            <div class="orders-head">
              <h2 id="orders-title">Meus pedidos</h2>
              <div class="chip-row" id="order-filters" role="group" aria-label="Filtrar pedidos"><button type="button" class="chip" data-group="todos" aria-pressed="true">Todos <span class="chip-count">0</span></button><button type="button" class="chip" data-group="andamento" aria-pressed="false">Em andamento <span class="chip-count">0</span></button><button type="button" class="chip" data-group="concluidos" aria-pressed="false">Concluídos <span class="chip-count">0</span></button><button type="button" class="chip" data-group="cancelados" aria-pressed="false">Cancelados <span class="chip-count">0</span></button></div>
            </div>
            <div id="orders" class="order-list"><div class="loading">Carregando compras…</div></div>
          </section>
          <section class="panel profile-panel" aria-labelledby="profile-title">
            <h2 id="profile-title">Meus dados</h2>
            <form id="profile-form">
              <div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" type="text" required minlength="2" maxlength="200" autocomplete="name" /></div>
              <div class="field"><label for="email">E-mail de acesso</label><input id="email" name="email" type="email" readonly /></div>
              <div class="field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" maxlength="30" autocomplete="tel" /></div>
              <div class="field"><label for="endereco">Endereço</label><input id="endereco" name="endereco" type="text" maxlength="500" autocomplete="street-address" /></div>
              <button type="submit" class="full">Salvar meus dados</button>
            </form>
          </section>
        </div>
      </div>
    </main>
    <div id="footer"></div>
  </body>
</html>
