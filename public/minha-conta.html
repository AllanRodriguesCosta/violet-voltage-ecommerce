<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Violet Voltage: guitarras e equipamentos. Turn Up Your Tone. Guitarras, pedais, amplificadores e acessórios."
    />
    <title>Minha conta | Violet Voltage</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main id="main">
      <div class="container page-wrap">
        <div class="breadcrumb"><a href="/">Início</a> / Minha conta</div>
        <div class="row space-between">
          <div>
            <h1 class="page-title">Seu espaço, seu som.</h1>
            <p class="lead">
              Dados pessoais e histórico de compras em um só lugar.
            </p>
          </div>
          <button id="logout" class="secondary">Sair da conta</button>
        </div>
        <div class="account-grid">
          <section class="panel">
            <h2>Meu perfil</h2>
            <form id="profile-form">
              <div class="field">
                <label for="nome">Nome completo</label
                ><input
                  id="nome"
                  name="nome"
                  type="text"
                  required
                  minlength="2"
                  maxlength="200"
                  autocomplete="name"
                />
              </div>
              <div class="field">
                <label for="email">E-mail de acesso</label
                ><input id="email" name="email" type="email" readonly />
              </div>
              <div class="field">
                <label for="telefone">Telefone</label
                ><input
                  id="telefone"
                  name="telefone"
                  type="tel"
                  maxlength="30"
                  autocomplete="tel"
                />
              </div>
              <div class="field">
                <label for="endereco">Endereço</label
                ><input
                  id="endereco"
                  name="endereco"
                  type="text"
                  maxlength="500"
                  autocomplete="street-address"
                />
              </div>
              <button type="submit" class="full">Salvar meus dados</button>
            </form>
          </section>
          <section>
            <h2>Minhas compras</h2>
            <p class="small muted">
              Abra um pedido para consultar os itens e a entrega.
            </p>
            <div id="orders">
              <div class="loading">Carregando compras…</div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <div id="footer"></div>
  </body>
</html>
