<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Violet Voltage: guitarras, pedais, amplificadores e acessórios. Turn Up Your Tone." />
    <meta name="theme-color" content="#120b19" />
    <meta name="robots" content="noindex" />
    <meta property="og:site_name" content="Violet Voltage" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Criar conta | Violet Voltage" />
    <meta property="og:description" content="Violet Voltage: guitarras, pedais, amplificadores e acessórios. Turn Up Your Tone." />
    <title>Criar conta | Violet Voltage</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/ui.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body class="page-auth">
    <div id="header"></div>
    <main id="main" tabindex="-1">
      <div class="container auth-wrap">
        <section class="panel auth-panel">
          <span class="eyebrow">Seu próximo capítulo</span>
          <h1 class="auth-title">Faça parte do som.</h1>
          <p class="auth-intro">Crie sua conta para explorar todas as possibilidades.</p>
          <form id="register-form">
            <div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" type="text" required minlength="2" maxlength="200" autocomplete="name" /></div>
            <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required maxlength="200" autocomplete="email" /></div>
            <div class="field"><label for="telefone">Telefone (opcional)</label><input id="telefone" name="telefone" type="tel" maxlength="30" autocomplete="tel" /></div>
            <div class="field"><label for="endereco">Endereço (opcional)</label><input id="endereco" name="endereco" type="text" maxlength="500" autocomplete="street-address" /></div>
            <div class="field"><label for="senha">Senha (10 a 72 caracteres)</label><input id="senha" name="senha" type="password" required minlength="10" maxlength="72" autocomplete="new-password" /></div>
            <button type="submit" class="full">Criar minha conta</button>
          </form>
          <p class="auth-bottom">Já tem conta? <a href="/login.html">Entrar</a></p>
        </section>
        <aside class="auth-aside" aria-hidden="true"><span class="eyebrow">Violet Voltage</span><p class="auth-quote">“Cada setup conta uma história. Qual é a sua?”</p><img src="/assets/hero.svg" alt="" width="320" height="290" /></aside>
      </div>
    </main>
    <div id="footer"></div>
  </body>
</html>
