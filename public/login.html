<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Violet Voltage: guitarras e equipamentos. Turn Up Your Tone. Loja acadêmica com pagamentos demonstrativos."
    />
    <title>Entrar | Violet Voltage</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main id="main">
      <div class="container">
        <section class="panel narrow">
          <span class="eyebrow">Bem-vindo de volta</span>
          <h1 class="auth-title">Conecte-se ao seu som.</h1>
          <p class="auth-intro">
            Entre para acompanhar suas compras e montar seu próximo setup.
          </p>
          <form id="login-form">
            <div class="field">
              <label for="email">E-mail</label
              ><input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
                maxlength="200"
              />
            </div>
            <div class="field">
              <label for="senha">Senha</label
              ><input
                id="senha"
                name="senha"
                type="password"
                required
                autocomplete="current-password"
                maxlength="72"
              />
            </div>
            <button type="submit" class="full">Entrar na minha conta</button>
          </form>
          <p class="auth-bottom">
            Ainda não tem conta? <a href="/cadastro.html">Cadastre-se</a>
          </p>
        </section>
      </div>
    </main>
    <div id="footer"></div>
  </body>
</html>
