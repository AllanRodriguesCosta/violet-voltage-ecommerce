<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Violet Voltage: guitarras e equipamentos. Turn Up Your Tone. Loja acadêmica com pagamentos demonstrativos."
    />
    <title>Criar conta | Violet Voltage</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main id="main">
      <div class="container">
        <section class="panel narrow">
          <span class="eyebrow">Seu próximo capítulo</span>
          <h1 class="auth-title">Faça parte do som.</h1>
          <p class="auth-intro">
            Crie sua conta para explorar todas as possibilidades.
          </p>
          <form id="register-form">
            <div class="field">
              <label for="nome">Nome completo</label
              ><input
                id="nome"
                name="nome"
                type="text"
                required
                minlength="2"
                maxlength="200"
                autocomplete="name"
              />
            </div>
            <div class="field">
              <label for="email">E-mail</label
              ><input
                id="email"
                name="email"
                type="email"
                required
                maxlength="200"
                autocomplete="email"
              />
            </div>
            <div class="field">
              <label for="telefone">Telefone (opcional)</label
              ><input
                id="telefone"
                name="telefone"
                type="tel"
                maxlength="30"
                autocomplete="tel"
              />
            </div>
            <div class="field">
              <label for="endereco">Endereço (opcional)</label
              ><input
                id="endereco"
                name="endereco"
                type="text"
                maxlength="500"
                autocomplete="street-address"
              />
            </div>
            <div class="field">
              <label for="senha">Senha (10 a 72 caracteres)</label
              ><input
                id="senha"
                name="senha"
                type="password"
                required
                minlength="10"
                maxlength="72"
                autocomplete="new-password"
              />
            </div>
            <button type="submit" class="full">Criar minha conta</button>
          </form>
          <p class="auth-bottom">
            Já tem conta? <a href="/login.html">Entrar</a>
          </p>
        </section>
      </div>
    </main>
    <div id="footer"></div>
  </body>
</html>
